  <h1 class="page-title">Browser Objects (window, navigator, location)</h1>
  <p class="subtitle">Demonstrates common BOM (Browser Object Model) properties.</p>
  <div class="program-box">
<button class="btn" onclick="run()">Show Browser Info</button><div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

function run(){
  document.getElementById('out').textContent =
`Window size: ${window.innerWidth} x ${window.innerHeight}
Browser: ${navigator.userAgent}
Platform: ${navigator.platform}
Current URL: ${location.href}
Cookies enabled: ${navigator.cookieEnabled}`;
}

</script>
